<!--@layout(/layout/basic/layout.html)-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css">

<style>
    :root {
        --hsw-blue: #1848cc;
        --hsw-blue-light: #f0f6ff;
        --hsw-border: #e1e1e1;
        --hsw-text: #222;
        --hsw-kakao-yellow: #FEE500;
        --hsw-kakao-brown: #3C1E1E;
    }

    /* 전체 배경 및 폰트 설정 */
    .ajd-body-bg {
        background-color: #f4f6f9;
        min-height: 100vh;
        padding: 0 0 120px;
        font-family: 'Pretendard', -apple-system, sans-serif;
        color: var(--hsw-text);
    }

    /* 상단 통신사 선택 탭 */
    .ajd-top-container {
        background: white;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.05);
        margin-bottom: 30px;
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
    }

    .ajd-top-tabs {
        display: flex;
        justify-content: center;
        max-width: 900px;
        margin: 0 auto;
    }

    .ajd-top-tab {
        padding: 20px 24px;
        color: #999;
        font-weight: 700;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: 0.2s;
    }

    .ajd-top-tab.active {
        color: var(--hsw-blue);
        border-bottom: 3px solid var(--hsw-blue);
    }

    /* 컨텐츠 레이아웃 */
    .ajd-header { text-align: center; margin-bottom: 30px; padding-top: 20px; }
    .ajd-calc-container { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    .ajd-group { margin-bottom: 40px; }
    .ajd-label { font-size: 1.25rem; font-weight: 800; margin-bottom: 16px; color: #000; }

    /* 상품 카드 그리드 */
    .ajd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    
    .ajd-card {
        border: 1px solid var(--hsw-border);
        border-radius: 14px;
        background: #fff;
        padding: 20px 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 140px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .ajd-card.active {
        border: 2px solid var(--hsw-blue);
        background: var(--hsw-blue-light);
        color: var(--hsw-blue);
        box-shadow: 0 8px 20px rgba(24, 72, 204, 0.12);
    }

    .ajd-card-toptag { font-size: 0.8rem; color: #888; margin-bottom: 8px; background: #f5f5f5; padding: 3px 8px; border-radius: 4px; font-weight: 600; align-self: center; }
    .ajd-card-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; word-break: keep-all; }
    .ajd-card-price { font-size: 1rem; font-weight: 700; }

    /* 하단 고정 바 */
    .ajd-sticky-bar {
        position: fixed; bottom: 0; left: 0; width: 100%;
        background: #222; color: white; padding: 20px 0; z-index: 1000;
        border-radius: 24px 24px 0 0;
        box-shadow: 0 -5px 20px rgba(0,0,0,0.15);
    }

    .ajd-bar-inner { max-width: 800px; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
    .ajd-bar-info { display: flex; flex-direction: column; }
    .ajd-bar-label { font-size: 0.8rem; color: #bbb; margin-bottom: 4px; }
    .ajd-bar-price { font-size: 1.25rem; font-weight: 700; }
    .ajd-bar-cash { font-size: 1.25rem; font-weight: 700; color: #ffeb3b; } /* 현금 강조 색상 */
    .ajd-bar-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.1); margin: 0 15px; }

    /* 카카오톡 스타일 버튼 */
    .ajd-btn-submit { 
        background: var(--hsw-kakao-yellow); 
        color: var(--hsw-kakao-brown); 
        border: none; 
        padding: 14px 25px; 
        border-radius: 10px; 
        font-weight: 700; 
        font-size: 1rem; 
        cursor: pointer; 
        text-decoration: none;
        display: inline-block;
        transition: background 0.2s;
    }
    .ajd-btn-submit:hover { background: #fada00; }

    /* 모바일 대응 */
    @media (max-width: 768px) {
        .ajd-grid { grid-template-columns: 1fr; }
        .ajd-card { flex-direction: row; justify-content: space-between; padding: 15px 20px; min-height: auto; text-align: left; }
        .ajd-card-toptag { margin-bottom: 0; order: 0; min-width: 65px; }
        .ajd-card-title { margin: 0 15px; flex: 1; order: 1; }
        .ajd-card-price { order: 2; }
        .ajd-top-tabs { justify-content: flex-start; }
        .ajd-bar-inner { padding: 0 15px; }
        .ajd-btn-submit { padding: 12px 15px; font-size: 0.9rem; }
    }
</style>

<div class="ajd-body-bg">
    <div class="ajd-wrapper">
        <!-- 통신사 선택 탭 -->
        <div class="ajd-top-container">
            <div class="ajd-top-tabs">
                <div class="ajd-top-tab active" data-carrier="kt">KT 올레</div>
                <div class="ajd-top-tab" data-carrier="lg">LG 유플러스</div>
                <div class="ajd-top-tab" data-carrier="sk">SKT</div>
                <div class="ajd-top-tab" data-carrier="skylife">스카이라이프</div>
                <div class="ajd-top-tab" data-carrier="hello">LG헬로비전</div>
                <div class="ajd-top-tab" data-carrier="skb">SKB(pop)</div>
            </div>
        </div>

        <div class="ajd-header">
            <h2 style="font-weight: 900;">🌐 인터넷+TV 요금 계산기</h2>
            <p>상품을 선택하면 <strong>월 요금</strong>과 <strong>사은품</strong>이 자동 계산됩니다.</p>
        </div>

        <div class="ajd-calc-container">
            <!-- 인터넷 영역 -->
            <section class="ajd-group">
                <h3 class="ajd-label">1. 인터넷 상품 선택</h3>
                <div class="ajd-grid" id="ajd-internet-list">
                    <p style="text-align:center; grid-column: 1/-1; padding: 40px 0;">데이터를 불러오는 중...</p>
                </div>
            </section>

            <!-- TV 영역 -->
            <section class="ajd-group">
                <h3 class="ajd-label">2. TV 상품 선택</h3>
                <div class="ajd-grid" id="ajd-tv-list"></div>
            </section>

            <!-- 하단 고정 결과 바 -->
            <div class="ajd-sticky-bar">
                <div class="ajd-bar-inner">
                    <div class="ajd-bar-info">
                        <span class="ajd-bar-label">월 예상 요금</span>
                        <span class="ajd-bar-price" id="total-price">0원</span>
                    </div>
                    <div class="ajd-bar-divider"></div>
                    <div class="ajd-bar-info">
                        <span class="ajd-bar-label">현금 사은품</span>
                        <span class="ajd-bar-cash" id="total-cash">0만원</span>
                    </div>
                    <!-- 카톡 연결 버튼 -->
                    <a href="http://pf.kakao.com/_sdYlu/chat" target="_blank" class="ajd-btn-submit">카톡 상담신청</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // [중요] 배포한 웹 앱 URL
    const SHEET_URL = "https://script.google.com/macros/s/AKfycbwCopYUOB4bJ8eIrbUhl6xoAZvikF-hmajmzVGzW9Vs1K9N-rcuzVO3BIN95s50Od3P/exec"; 

    let allProducts = [];

    async function fetchData() {
        try {
            const response = await fetch(SHEET_URL);
            allProducts = await response.json();
            
            document.querySelectorAll('.ajd-top-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.ajd-top-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    render(this.getAttribute('data-carrier'));
                });
            });

            render('kt');
        } catch (error) {
            console.error("실패:", error);
            document.getElementById('ajd-internet-list').innerHTML = "데이터 로딩 실패. 관리자에게 문의하세요.";
        }
    }

    function render(carrier) {
        const internetList = document.getElementById('ajd-internet-list');
        const tvList = document.getElementById('ajd-tv-list');
        internetList.innerHTML = '';
        tvList.innerHTML = '';

        const filtered = allProducts.filter(p => p.Carrier && p.Carrier.trim().toLowerCase() === carrier.toLowerCase());

        filtered.forEach(p => {
            const isActive = p.IsActive === 'Y' ? 'active' : '';
            const card = `
                <div class="ajd-card ${isActive}" 
                     data-price="${p.Price}" 
                     data-cash="${p.Cash}" 
                     onclick="selectCard(this)">
                    <div class="ajd-card-toptag">${p.Speed || '-'}</div>
                    <div class="ajd-card-title">${p.Name}</div>
                    <div class="ajd-card-price">${Number(p.Price).toLocaleString()}원</div>
                </div>`;

            if (p.Category && p.Category.trim().toLowerCase() === 'internet') {
                internetList.innerHTML += card;
            } else if (p.Category && p.Category.trim().toLowerCase() === 'tv') {
                tvList.innerHTML += card;
            }
        });

        updateTotal();
    }

    function selectCard(el) {
        const siblings = el.parentElement.querySelectorAll('.ajd-card');
        siblings.forEach(s => s.classList.remove('active'));
        el.classList.add('active');
        updateTotal();
    }

    function updateTotal() {
        let totalP = 0;
        let totalC = 0;

        document.querySelectorAll('.ajd-card.active').forEach(card => {
            totalP += parseInt(card.dataset.price || 0);
            totalC += parseInt(card.dataset.cash || 0);
        });

        document.getElementById('total-price').innerText = totalP.toLocaleString() + "원";
        document.getElementById('total-cash').innerText = totalC + "만원";
    }

    fetchData();
</script>
